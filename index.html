<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow Pro - Modern Task Manager</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased selection:bg-brand-500 selection:text-white">
  <div id="app" class="flex flex-col min-h-screen">
    <!-- Header -->
    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700/60 sticky top-0 z-30 px-4 py-3 sm:px-6">
      <div class="max-w-7xl mx-auto flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="p-2 bg-brand-600 rounded-xl text-white shadow-lg shadow-brand-500/30 flex items-center justify-center">
            <i class="fa-solid fa-list-check text-xl"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">TaskFlow Pro</h1>
            <p class="text-xs text-slate-400 hidden sm:block">スマートな生産性 & タスク管理</p>
          </div>
        </div>
        <div class="flex items-center space-x-3">
          <span id="onlineStatus" class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span>Online
          </span>
          <button id="installPWA" class="hidden bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5 shadow-md shadow-brand-600/20">
            <i class="fa-solid fa-download"></i> アプリ化
          </button>
          <button id="themeToggle" class="p-2 rounded-lg bg-slate-700/50 hover:bg-slate-700 text-slate-300 hover:text-white transition">
            <i class="fa-solid fa-moon text-sm"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <div class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 sm:px-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
      <!-- Sidebar -->
      <aside class="space-y-6 lg:col-span-1">
        <!-- Task Stats -->
        <div class="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-4 shadow-xl backdrop-blur-sm">
          <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3"><i class="fa-solid fa-chart-pie mr-1.5 text-brand-500"></i>進捗状況</h2>
          <div class="grid grid-cols-3 gap-2 text-center">
            <div class="p-2.5 rounded-xl bg-slate-800 border border-slate-700/60">
              <div id="countAll" class="text-lg font-bold text-slate-100">0</div>
              <div class="text-[10px] text-slate-400 uppercase font-semibold">全タスク</div>
            </div>
            <div class="p-2.5 rounded-xl bg-slate-800 border border-slate-700/60">
              <div id="countInProgress" class="text-lg font-bold text-amber-400">0</div>
              <div class="text-[10px] text-slate-400 uppercase font-semibold">進行中</div>
            </div>
            <div class="p-2.5 rounded-xl bg-slate-800 border border-slate-700/60">
              <div id="countCompleted" class="text-lg font-bold text-emerald-400">0</div>
              <div class="text-[10px] text-slate-400 uppercase font-semibold">完了</div>
            </div>
          </div>
          <div class="mt-4">
            <div class="flex justify-between text-xs text-slate-400 mb-1">
              <span>達成率</span>
              <span id="progressPercent" class="font-semibold text-brand-400">0%</span>
            </div>
            <div class="w-full bg-slate-700/60 h-2 rounded-full overflow-hidden">
              <div id="progressBar" class="bg-brand-500 h-full w-0 transition-all duration-500 rounded-full"></div>
            </div>
          </div>
        </div>

        <!-- Status Filter -->
        <div class="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-4 shadow-xl backdrop-blur-sm">
          <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3"><i class="fa-solid fa-filter mr-1.5 text-brand-500"></i>ステータス</h2>
          <nav class="space-y-1" id="statusFilterGroup">
            <button data-status="all" class="status-btn active w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium transition-all text-slate-200 bg-slate-700/50">
              <span><i class="fa-solid fa-list mr-2 text-slate-400"></i>すべて</span>
              <span id="filterAllBadge" class="bg-slate-800 px-2 py-0.5 rounded-full text-xs text-slate-400">0</span>
            </button>
            <button data-status="todo" class="status-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium transition-all text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
              <span><i class="fa-regular fa-circle mr-2 text-blue-400"></i>未完了</span>
              <span id="filterTodoBadge" class="bg-slate-800 px-2 py-0.5 rounded-full text-xs text-slate-400">0</span>
            </button>
            <button data-status="in-progress" class="status-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium transition-all text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
              <span><i class="fa-solid fa-spinner mr-2 text-amber-400"></i>進行中</span>
              <span id="filterInProgressBadge" class="bg-slate-800 px-2 py-0.5 rounded-full text-xs text-slate-400">0</span>
            </button>
            <button data-status="completed" class="status-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium transition-all text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
              <span><i class="fa-regular fa-circle-check mr-2 text-emerald-400"></i>完了</span>
              <span id="filterCompletedBadge" class="bg-slate-800 px-2 py-0.5 rounded-full text-xs text-slate-400">0</span>
            </button>
          </nav>
        </div>

        <!-- Tag Filter -->
        <div class="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-4 shadow-xl backdrop-blur-sm">
          <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3"><i class="fa-solid fa-hashtag mr-1.5 text-brand-500"></i>タグ</h2>
          <div id="tagFilterContainer" class="flex flex-wrap gap-1.5">
            <button data-tag="all" class="tag-filter-btn active text-xs px-3 py-1.5 rounded-lg border border-brand-500/50 bg-brand-500/20 text-brand-300 font-medium transition">すべて</button>
          </div>
        </div>
      </aside>

      <!-- Task Main Board -->
      <main class="lg:col-span-3 space-y-6">
        <!-- Quick Add Task Card -->
        <div class="bg-slate-800/80 border border-slate-700/70 rounded-2xl p-4 sm:p-5 shadow-2xl backdrop-blur-md">
          <form id="addTaskForm" class="space-y-4">
            <div class="flex flex-col sm:flex-row gap-3">
              <input type="text" id="taskTitle" required placeholder="新しいタスク名を入力..." class="flex-1 bg-slate-900/80 border border-slate-700 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 rounded-xl px-4 py-2.5 text-slate-100 placeholder-slate-500 outline-none text-sm transition">
              <button type="submit" class="bg-brand-600 hover:bg-brand-500 active:bg-brand-700 text-white px-5 py-2.5 rounded-xl font-medium text-sm transition-all shadow-lg shadow-brand-600/30 flex items-center justify-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-plus"></i> タスク追加
              </button>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-1">
              <div>
                <label class="block text-[11px] text-slate-400 font-medium mb-1">優先度</label>
                <select id="taskPriority" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-slate-200 outline-none focus:border-brand-500">
                  <option value="low">低 (Low)</option>
                  <option value="medium" selected>中 (Medium)</option>
                  <option value="high">高 (High)</option>
                </select>
              </div>
              <div>
                <label class="block text-[11px] text-slate-400 font-medium mb-1">タグ (カンマ区切り)</label>
                <input type="text" id="taskTags" placeholder="仕事, 設計, 要件" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-slate-200 outline-none focus:border-brand-500">
              </div>
              <div>
                <label class="block text-[11px] text-slate-400 font-medium mb-1">期限日</label>
                <input type="date" id="taskDueDate" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-slate-200 outline-none focus:border-brand-500">
              </div>
            </div>
          </form>
        </div>

        <!-- Task Filtering & Search Controls -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-3 bg-slate-800/40 p-3 border border-slate-700/40 rounded-xl">
          <div class="relative w-full sm:w-72">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input type="text" id="searchInput" placeholder="タスクを検索..." class="w-full bg-slate-900/90 border border-slate-700 rounded-lg pl-8 pr-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 outline-none focus:border-brand-500 transition">
          </div>
          <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
            <span class="text-xs text-slate-400 whitespace-nowrap">並び替え:</span>
            <select id="sortSelect" class="bg-slate-900/90 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 outline-none focus:border-brand-500">
              <option value="createdAt-desc">作成日 (新しい順)</option>
              <option value="createdAt-asc">作成日 (古い順)</option>
              <option value="priority-desc">優先度 (高い順)</option>
              <option value="dueDate-asc">期限日 (近い順)</option>
            </select>
          </div>
        </div>

        <!-- Task Items Container -->
        <div id="taskList" class="space-y-3">
          <!-- Dynamic Task Render Target -->
        </div>
      </main>
    </div>
  </div>

  <!-- Edit Task Modal -->
  <div id="editModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-md p-6 shadow-2xl space-y-4 transform transition-all scale-95 opacity-0 modal-content">
      <div class="flex items-center justify-between border-b border-slate-700 pb-3">
        <h3 class="text-base font-bold text-slate-100"><i class="fa-solid fa-pen-to-square text-brand-500 mr-2"></i>タスク編集</h3>
        <button id="closeEditModal" class="text-slate-400 hover:text-slate-200 p-1 rounded-lg hover:bg-slate-700/50 transition"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="editTaskForm" class="space-y-3">
        <input type="hidden" id="editTaskId">
        <div>
          <label class="block text-xs text-slate-400 mb-1">タスク名</label>
          <input type="text" id="editTaskTitle" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 outline-none focus:border-brand-500">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">詳細説明</label>
          <textarea id="editTaskDesc" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 outline-none focus:border-brand-500 resize-none"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">優先度</label>
            <select id="editTaskPriority" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 outline-none focus:border-brand-500">
              <option value="low">低 (Low)</option>
              <option value="medium">中 (Medium)</option>
              <option value="high">高 (High)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">ステータス</label>
            <select id="editTaskStatus" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 outline-none focus:border-brand-500">
              <option value="todo">未完了</option>
              <option value="in-progress">進行中</option>
              <option value="completed">完了</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">タグ (カンマ区切り)</label>
            <input type="text" id="editTaskTags" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-100 outline-none focus:border-brand-500">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">期限日</label>
            <input type="date" id="editTaskDueDate" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-100 outline-none focus:border-brand-500">
          </div>
        </div>
        <div class="flex justify-end gap-2 pt-3 border-t border-slate-700/60">
          <button type="button" id="cancelEditBtn" class="px-4 py-2 text-xs font-medium text-slate-300 hover:bg-slate-700/50 rounded-lg transition">キャンセル</button>
          <button type="submit" class="px-4 py-2 text-xs font-medium bg-brand-600 hover:bg-brand-500 text-white rounded-lg transition shadow-md shadow-brand-600/20">変更を保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script src="app.js"></script>
</body>
</html>
